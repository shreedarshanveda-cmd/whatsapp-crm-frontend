<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>WhatsApp CRM Mobile</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased overflow-hidden select-none">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const initialContacts = [
      { id: "1", name: "Rahul Sharma", phone: "+91 98765 43210", source: "Facebook Ad", status: "active", unread: 2, lastMsg: "Price details please?", time: "10:30 AM" },
      { id: "2", name: "Pooja Verma", phone: "+91 91234 56789", source: "Instagram DM", status: "active", unread: 0, lastMsg: "Payment confirmed, thank you!", time: "09:45 AM" },
      { id: "3", name: "Amit Patel", phone: "+91 99887 76655", source: "Website Widget", status: "active", unread: 0, lastMsg: "Can you deliver to Delhi?", time: "Yesterday" },
      { id: "4", name: "Suresh Gupta", phone: "+91 88776 65544", source: "Organic", status: "opted_out", unread: 0, lastMsg: "STOP", time: "24 Sep" }
    ];

    const initialMessages = {
      "1": [
        { id: "m1", sender: "customer", text: "Hi, I saw your ad on Facebook.", time: "10:28 AM" },
        { id: "m2", sender: "bot", text: "Hello Rahul! How can we assist you today?", time: "10:29 AM" },
        { id: "m3", sender: "customer", text: "Price details please?", time: "10:30 AM" }
      ],
      "2": [
        { id: "m4", sender: "me", text: "Your tracking link sent.", time: "09:40 AM" },
        { id: "m5", sender: "customer", text: "Payment confirmed, thank you!", time: "09:45 AM" }
      ],
      "3": [{ id: "m6", sender: "customer", text: "Can you deliver to Delhi?", time: "Yesterday" }],
      "4": [{ id: "m7", sender: "customer", text: "STOP", time: "24 Sep" }]
    };

    function App() {
      const [activeTab, setActiveTab] = useState("inbox");
      const [selectedContact, setSelectedContact] = useState(null);
      const [contacts, setContacts] = useState(initialContacts);
      const [messages, setMessages] = useState(initialMessages);
      const [replyText, setReplyText] = useState("");
      const [campaignName, setCampaignName] = useState("");
      const [broadcastSuccess, setBroadcastSuccess] = useState(false);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      }, [activeTab, selectedContact, messages]);

      const handleSend = (e) => {
        e.preventDefault();
        if (!replyText.trim() || !selectedContact) return;
        const newMsg = {
          id: "m_" + Date.now(),
          sender: "me",
          text: replyText,
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };
        setMessages(prev => ({
          ...prev,
          [selectedContact.id]: [...(prev[selectedContact.id] || []), newMsg]
        }));
        setReplyText("");
      };

      const handleBroadcast = (e) => {
        e.preventDefault();
        if (!campaignName) return;
        setBroadcastSuccess(true);
        setTimeout(() => setBroadcastSuccess(false), 3000);
        setCampaignName("");
      };

      return (
        <div className="flex flex-col h-screen w-full bg-slate-950">
          {/* Top Bar */}
          <header className="h-14 bg-slate-900 border-b border-slate-800 flex items-center justify-between px-4">
            <div className="flex items-center space-x-2">
              {selectedContact && activeTab === "inbox" ? (
                <button onClick={() => setSelectedContact(null)} className="text-slate-300 mr-2 p-1">
                  <i data-lucide="arrow-left" className="w-5 h-5"></i>
                </button>
              ) : null}
              <div className="w-7 h-7 rounded-lg bg-emerald-500/20 text-emerald-400 font-bold flex items-center justify-center text-sm border border-emerald-500/30">
                W
              </div>
              <span className="font-bold text-sm text-white">
                {selectedContact && activeTab === "inbox" ? selectedContact.name : "WA Cloud CRM"}
              </span>
            </div>
            <span className="text-[10px] bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 px-2 py-0.5 rounded-full font-mono">
              Live Edge
            </span>
          </header>

          {/* Main Body */}
          <main className="flex-1 overflow-hidden relative">
            {/* INBOX TAB */}
            {activeTab === "inbox" && (
              <div className="h-full flex flex-col">
                {!selectedContact ? (
                  /* Contacts List (Mobile Screen) */
                  <div className="flex-1 overflow-y-auto divide-y divide-slate-800/80">
                    {contacts.map(c => (
                      <div 
                        key={c.id} 
                        onClick={() => setSelectedContact(c)}
                        className="p-3.5 flex items-center space-x-3 active:bg-slate-900 transition">
                        <div className="w-11 h-11 rounded-full bg-slate-800 text-slate-200 flex items-center justify-center font-bold text-sm flex-shrink-0">
                          {c.name.charAt(0)}
                        </div>
                        <div className="flex-1 min-w-0">
                          <div className="flex justify-between items-baseline mb-0.5">
                            <h4 className="text-sm font-semibold text-white truncate">{c.name}</h4>
                            <span className="text-[10px] text-slate-500">{c.time}</span>
                          </div>
                          <p className="text-xs text-slate-400 truncate">{c.lastMsg}</p>
                          <div className="flex items-center space-x-2 mt-1">
                            <span className="text-[9px] px-1.5 py-0.2 rounded bg-slate-800 text-slate-300 border border-slate-700">
                              {c.source}
                            </span>
                            {c.status === "opted_out" && (
                              <span className="text-[9px] px-1 rounded bg-rose-950 text-rose-300 border border-rose-800">
                                Opt-out
                              </span>
                            )}
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                ) : (
                  /* Active Chat View */
                  <div className="h-full flex flex-col justify-between bg-slate-950">
                    <div className="flex-1 p-3 overflow-y-auto space-y-3">
                      {(messages[selectedContact.id] || []).map(m => (
                        <div key={m.id} className={`flex flex-col ${m.sender === 'me' ? 'items-end' : m.sender === 'bot' ? 'items-center' : 'items-start'}`}>
                          {m.sender === 'bot' ? (
                            <span className="text-[11px] bg-slate-800 text-slate-400 px-3 py-1 rounded-full border border-slate-700">
                              AI: {m.text}
                            </span>
                          ) : (
                            <div className={`max-w-[80%] p-2.5 rounded-2xl text-xs ${m.sender === 'me' ? 'bg-emerald-600 text-white rounded-br-none' : 'bg-slate-800 text-slate-200 rounded-bl-none border border-slate-700'}`}>
                              <p>{m.text}</p>
                              <span className="text-[9px] block text-right mt-1 opacity-75">{m.time}</span>
                            </div>
                          )}
                        </div>
                      ))}
                    </div>

                    {/* Chat Input */}
                    <form onSubmit={handleSend} className="p-2 border-t border-slate-800 bg-slate-900 flex space-x-2">
                      <input 
                        type="text" 
                        value={replyText} 
                        onChange={e => setReplyText(e.target.value)} 
                        placeholder="Type reply..." 
                        className="flex-1 bg-slate-800 border border-slate-700 text-white text-xs px-3 py-2 rounded-xl focus:outline-none"
                      />
                      <button type="submit" className="bg-emerald-600 active:bg-emerald-700 text-white p-2 rounded-xl">
                        <i data-lucide="send" className="w-4 h-4"></i>
                      </button>
                    </form>
                  </div>
                )}
              </div>
            )}

            {/* BROADCAST TAB */}
            {activeTab === "broadcast" && (
              <div className="p-4 space-y-4 overflow-y-auto h-full">
                <h2 className="text-base font-bold text-white">Broadcast Blast</h2>
                {broadcastSuccess && (
                  <div className="p-2.5 bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs rounded-lg">
                    Broadcast Sent to 3 Leads!
                  </div>
                )}
                <div className="bg-slate-900 border border-slate-800 p-4 rounded-xl space-y-3">
                  <div>
                    <label className="text-xs text-slate-400 block mb-1">Campaign Title</label>
                    <input 
                      type="text" 
                      value={campaignName}
                      onChange={e => setCampaignName(e.target.value)}
                      placeholder="Special Sale Offer" 
                      className="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-xs text-white"
                    />
                  </div>
                  <div>
                    <label className="text-xs text-slate-400 block mb-1">Select Meta Template</label>
                    <select className="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-xs text-white">
                      <option>welcome_offer_oct (Marketing)</option>
                      <option>order_confirmation (Utility)</option>
                    </select>
                  </div>
                  <button 
                    onClick={handleBroadcast} 
                    className="w-full bg-emerald-600 active:bg-emerald-700 text-white font-bold p-2.5 rounded-lg text-xs">
                    Send 1-Click Broadcast
                  </button>
                </div>
              </div>
            )}

            {/* CONTACTS TAB */}
            {activeTab === "contacts" && (
              <div className="p-4 space-y-3 overflow-y-auto h-full">
                <h2 className="text-base font-bold text-white">Leads ({contacts.length})</h2>
                <div className="space-y-2">
                  {contacts.map(c => (
                    <div key={c.id} className="bg-slate-900 border border-slate-800 p-3 rounded-xl flex justify-between items-center">
                      <div>
                        <div className="text-xs font-bold text-white">{c.name}</div>
                        <div className="text-[11px] text-slate-400">{c.phone}</div>
                        <span className="text-[9px] px-1.5 py-0.5 rounded bg-slate-800 text-slate-300 border border-slate-700">
                          {c.source}
                        </span>
                      </div>
                      <button 
                        onClick={() => { setSelectedContact(c); setActiveTab("inbox"); }}
                        className="text-xs bg-slate-800 border border-slate-700 px-3 py-1.5 rounded-lg text-emerald-400 font-semibold">
                        Chat
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </main>

          {/* Bottom Mobile Tab Bar */}
          <nav className="h-14 bg-slate-900 border-t border-slate-800 flex items-center justify-around px-2">
            <button 
              onClick={() => { setActiveTab("inbox"); setSelectedContact(null); }}
              className={`flex flex-col items-center py-1 ${activeTab === 'inbox' ? 'text-emerald-400 font-bold' : 'text-slate-400'}`}>
              <i data-lucide="message-square" className="w-5 h-5"></i>
              <span className="text-[10px] mt-0.5">Chats</span>
            </button>
            <button 
              onClick={() => setActiveTab("broadcast")}
              className={`flex flex-col items-center py-1 ${activeTab === 'broadcast' ? 'text-emerald-400 font-bold' : 'text-slate-400'}`}>
              <i data-lucide="send" className="w-5 h-5"></i>
              <span className="text-[10px] mt-0.5">Broadcast</span>
            </button>
            <button 
              onClick={() => setActiveTab("contacts")}
              className={`flex flex-col items-center py-1 ${activeTab === 'contacts' ? 'text-emerald-400 font-bold' : 'text-slate-400'}`}>
              <i data-lucide="users" className="w-5 h-5"></i>
              <span className="text-[10px] mt-0.5">Leads</span>
            </button>
          </nav>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
  </html>
